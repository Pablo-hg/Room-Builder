name: Room Builder CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: room-builder-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-build:
    name: Unitarias y build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Entorno reproducible
        run: |
          node --version
          npm --version
          git rev-parse HEAD
      - run: npm ci
      - name: Pruebas unitarias
        run: npm test
      # El build es una comprobación independiente: no omitirlo si fallan tests.
      # GitHub Actions evalúa !cancelled() incluso si una etapa anterior falló.
      - name: Compilación de producción
        if: ${{ !cancelled() }}
        run: npm run build

  e2e-smoke:
    name: E2E de humo (Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Dependencias limpias
        run: npm ci
      - name: Instalar Chromium y dependencias del sistema
        run: npx playwright install --with-deps chromium
      - name: Inventario de los tests de humo
        run: |
          npx playwright --version
          npx playwright test --list --grep @smoke
      # Solo los flujos críticos etiquetados con @smoke. La suite E2E completa se
      # ejecuta aparte (.github/workflows/e2e-full.yml) y antes de cada release.
      - name: Ejecutar los E2E de humo
        run: npm run test:e2e:smoke -- --workers=2
      - name: Conservar trazas y capturas de fallos
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: room-builder-e2e-smoke-failures
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
